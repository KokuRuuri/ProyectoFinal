{% extends "base.html" %}

{% block title %}Explorar{% endblock %}

{% block content %}
<div class="container mt-4">
  <h3 class="text-center mb-4">Explorar por letra</h3>
  <p class="text-center">Selecciona una letra para ver las revistas cuyo título inicia con esa letra.</p>
  <br>
  <div class="d-flex justify-content-center flex-wrap mb-4">
    {% for letra in letras %}
    <a href="{{ url_for('explorar', letra=letra) }}" class="btn btn-outline-primary m-1 {% if letra == letra_actual %}active{% endif %}">
      {{ letra }}
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
