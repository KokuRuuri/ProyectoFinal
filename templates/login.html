{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 1rem;">
        <div class="text-center mb-4"> <img src="{{ url_for('static', filename='imgs/UniDocs_logo.png') }}"
                alt="UniDocs" height="60">
            <h4 class="mt-3">Bienvenido a UniDocs</h4>
            <p class="text-muted">Inicia sesión para continuar</p>
        </div>
        <form method="post">
            <div class="mb-3"> <label for="usuario" class="form-label">Usuario</label>
                <div class="input-group"> <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario"
                        required> </div>
            </div>
            <div class="mb-3"> <label for="password" class="form-label">Contraseña</label>
                <div class="input-group"> <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Tu contraseña" required> </div>
            </div> <button type="submit" class="btn btn-primary w-100">Acceder</button>
        </form>
        <div class="text-center mt-3"> <small><a href="#" class="text-decoration-none">¿Olvidaste tu
                    contraseña?</a></small> </div>
    </div>
</div> {% endblock %}
