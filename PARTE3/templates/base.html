<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}UniDocs{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #003366;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      UniDocs
    </a>
    <div class="d-flex ms-auto">
      <img src="{{ url_for('static', filename='imgs/logo_unison.png') }}" alt="Unison" height="40">
    </div>
  </div>
</nav>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
  <div class="container">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('area') }}">Área</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('catalogos') }}">Catálogos</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('explorar') }}">Explorar</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('busqueda') }}">Busqueda</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('creditos') }}">Créditos</a></li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted mt-5 mb-3">
    <small>Universidad de Sonora &copy; 2025</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
